name: deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and build site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify responsive-image impact
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "responsive_images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed-files.txt
          cat changed-files.txt
          if grep -Eq '^(assets/img/|_config\.yml$|Gemfile$|Gemfile\.lock$)' changed-files.txt; then
            echo "responsive_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "responsive_images=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked helpers 🔧
        run: |
          python -m pip install --disable-pip-version-check --no-input 'nbconvert==7.17.1'
          npm ci --no-audit --no-fund

      - name: Verify source contracts 🔎
        run: |
          set -euo pipefail
          python scripts/check_site_sources.py
          npm run lint:style-contract
          npx prettier --check test/style_contract.js
          ruby -c _plugins/site_visual_polish.rb
          ruby -c _plugins/cloudflare_web_analytics.rb

      - name: Install responsive-image runtime
        if: steps.impact.outputs.responsive_images == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Build production site 🔧
        env:
          RESPONSIVE_IMAGES: ${{ steps.impact.outputs.responsive_images }}
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" ]]; then
            echo 'CLOUDFLARE_WEB_ANALYTICS_TOKEN repository variable is required.' >&2
            exit 1
          fi
          export JEKYLL_ENV=production
          config_args=(--config _config.yml)
          if [[ "$RESPONSIVE_IMAGES" != "true" ]]; then
            cat > .ci-jekyll.yml <<'YAML'
          imagemagick:
            enabled: false
          YAML
            config_args=(--config _config.yml,.ci-jekyll.yml)
          fi
          bundle exec jekyll build "${config_args[@]}" 2>&1 | tee .build-jekyll.log
          if grep -q 'Conflict: The following destination is shared by multiple files' .build-jekyll.log; then
            echo 'Jekyll emitted an ambiguous destination conflict.' >&2
            exit 1
          fi

      - name: Verify Cloudflare RUM artifact 🔎
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_WEB_ANALYTICS_TOKEN"
          grep -q 'static.cloudflareinsights.com/beacon.min.js' _site/index.html
          grep -q "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" _site/index.html

      - name: Verify built homepage structure 🔎
        run: |
          set -euo pipefail
          test -f _site/index.html
          grep -q 'hao-home--alfolio' _site/index.html
          grep -q 'hao-home-page' _site/index.html
          grep -q 'hao-home-navbar-brand' _site/index.html
          grep -q 'id="current-work"' _site/index.html
          grep -q 'id="selected-work"' _site/index.html
          grep -q 'id="notes-publications"' _site/index.html
          grep -q 'id="contact"' _site/index.html
          if grep -q 'mission-log-shell-v2.css' _site/index.html; then
            echo "Deprecated Mission Log stylesheet leaked into homepage artifact."
            exit 1
          fi
          if grep -q 'hao-home-v6.css' _site/index.html; then
            echo "Deprecated v6 stylesheet leaked into homepage artifact."
            exit 1
          fi

      - name: Verify repositories page layout artifact 🔎
        run: |
          set -euo pipefail
          test -f _site/repositories/index.html
          test -f _site/assets/css/repositories-page-polish.css
          grep -q 'hao-repositories-page' _site/repositories/index.html
          grep -q 'class="repo-grid"' _site/repositories/index.html
          grep -q 'class="repo-card__body"' _site/repositories/index.html
          grep -q 'grid-template-columns: repeat(2, minmax(0, 1fr))' _site/assets/css/repositories-page-polish.css
          grep -Fq 'html:not([data-theme="dark"]) .hao-repositories-page .repo-dark' _site/assets/css/repositories-page-polish.css

      - name: Verify CV TOC polish artifact 🔎
        run: |
          set -euo pipefail
          test -f _site/cv/index.html
          test -f _site/assets/css/cv-toc-polish.css
          grep -q 'hao-cv-page' _site/cv/index.html
          grep -q 'id="toc-sidebar"' _site/cv/index.html
          grep -q 'scrollbar-width: none' _site/assets/css/cv-toc-polish.css
          grep -q '::-webkit-scrollbar' _site/assets/css/cv-toc-polish.css

      - name: Verify secondary pages keep al-folio baseline 🔎
        run: |
          set -euo pipefail
          test -f _site/blog/index.html
          if grep -Eq 'site-polish.css|site-upgrade.css|hao-design.css|hao-home-safe.css|hao-home-center-fix.css|cv-toc-polish.css|repositories-page-polish.css' _site/blog/index.html; then
            echo "Scoped visual stylesheet leaked into blog index; secondary pages should keep the al-folio baseline."
            exit 1
          fi

      - name: PurgeCSS 🔧
        run: npx --yes purgecss@7.0.2 -c purgecss.config.js

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload validated Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy validated site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy 🚀
        id: deploy
        uses: actions/deploy-pages@v4
