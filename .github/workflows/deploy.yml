name: deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@v0.13.1
        with:
          commitChange: false
          valueFile: _config.yml
          propertyPath: giscus.repo
          value: ${{ github.repository }}

      - name: Install CLI helpers 🔧
        run: |
          pip install --upgrade pip nbconvert
          npm ci

      - name: Verify frontend contracts 🔎
        run: |
          set -euo pipefail
          npm run lint:style-contract
          npx prettier --check test/style_contract.js test/repositories_contract.js
          ruby -c _plugins/site_visual_polish.rb

      - name: Build (production) 🔧
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Verify built homepage artifact 🔎
        run: |
          set -euo pipefail
          test -f _site/index.html
          grep -q 'hao-home--alfolio' _site/index.html
          grep -q 'hao-home-page' _site/index.html
          grep -q 'Research records, shipped tools, and agentic AI systems.' _site/index.html
          grep -q 'Offshore Bergen · Aug 2020' _site/index.html
          grep -q 'Projects &amp; code' _site/index.html
          grep -q 'Notes &amp; publications' _site/index.html
          grep -q 'Climate-to-energy downscaling' _site/index.html
          grep -q 'OffshoreOrient Studio' _site/index.html
          grep -q 'Ductor — AI Agentic Harness' _site/index.html
          grep -q 'Snow-depth / ICESat-2 Zenodo dataset' _site/index.html
          grep -q 'ICESat-2 vs DTM1, DTM10, Copernicus30, FABDEM' _site/index.html
          grep -q 'NuthKaab Coreg vs Gradient Descent Coreg' _site/index.html
          grep -q 'Quad 35 hybrid seismic acquisition' _site/index.html
          grep -q 'calendar.app.google/UQ267iEs4MTAGFSd7' _site/index.html
          grep -q 'hao-home-center-fix.css?v=20260803-cv-toc-home-81' _site/index.html
          grep -q 'hao-home-navbar-brand' _site/index.html
          grep -q 'font-weight-bold">Zhihao</span> LIU' _site/index.html
          if grep -q 'GhostCam' _site/index.html; then
            echo "GhostCam remains in the curated homepage artifact."
            exit 1
          fi
          if grep -q 'id="trajectory"' _site/index.html; then
            echo "Deprecated placeholder trajectory section remains in homepage artifact."
            exit 1
          fi
          if grep -q 'mission-log-shell-v2.css' _site/index.html; then
            echo "Deprecated Mission Log stylesheet leaked into homepage artifact."
            exit 1
          fi
          if grep -q 'hao-home-v6.css' _site/index.html; then
            echo "Deprecated v6 stylesheet leaked into homepage artifact."
            exit 1
          fi

      - name: Verify repositories page layout artifact 🔎
        run: |
          set -euo pipefail
          test -f _site/repositories/index.html
          test -f _site/assets/css/repositories-page-polish.css
          grep -q 'hao-repositories-page' _site/repositories/index.html
          grep -q 'repositories-page-polish.css?v=20260803-cv-toc-home-81' _site/repositories/index.html
          grep -q 'class="repo-grid"' _site/repositories/index.html
          grep -q 'class="repo-card__body"' _site/repositories/index.html
          grep -q 'grid-template-columns: repeat(2, minmax(0, 1fr))' _site/assets/css/repositories-page-polish.css
          grep -q 'html:not(\[data-theme="dark"\]) .hao-repositories-page .repo-dark' _site/assets/css/repositories-page-polish.css

      - name: Verify CV TOC polish artifact 🔎
        run: |
          set -euo pipefail
          test -f _site/cv/index.html
          grep -q 'hao-cv-page' _site/cv/index.html
          grep -q 'id="toc-sidebar"' _site/cv/index.html
          grep -q 'cv-toc-polish.css?v=20260803-cv-toc-home-81' _site/cv/index.html
          test -f _site/assets/css/cv-toc-polish.css
          grep -q 'scrollbar-width: none' _site/assets/css/cv-toc-polish.css
          grep -q '::-webkit-scrollbar' _site/assets/css/cv-toc-polish.css

      - name: Verify secondary pages keep al-folio baseline 🔎
        run: |
          set -euo pipefail
          test -f _site/blog/index.html
          if grep -Eq 'site-polish.css|site-upgrade.css|hao-design.css|hao-home-safe.css|hao-home-center-fix.css|cv-toc-polish.css|repositories-page-polish.css' _site/blog/index.html; then
            echo "Scoped visual stylesheet leaked into blog index; secondary pages should keep the al-folio baseline."
            exit 1
          fi

      - name: PurgeCSS 🔧
        run: |
          set -euo pipefail
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy 🚀
        id: deploy
        uses: actions/deploy-pages@v4
