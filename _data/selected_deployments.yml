groups:
  - id: "projects"
    kicker: PROJECT ARCHIVE
    title: Research and field projects
    summary: Selected project records that are distinct from the products listed under Current work.
    deployments:
      - ref: P-01
        title: dMRV is the key
        status: RESEARCH
        kind: CCUS clusters / digital MRV
        summary: Digital monitoring, reporting, verification, and disclosure framework design for shared CCUS infrastructure and multi-party operations.
        href: /projects/2026_ccus_dmrv/
        primary_label: View project
      - ref: P-02
        title: OceanHub
        status: PLATFORM
        kind: Offshore energy / marine intelligence
        summary: A partner-facing offshore energy and marine intelligence portal supported by a reproducible content and presentation pipeline.
        href: https://liuh886.github.io/oceanhub/
        primary_label: Open app
        secondary_href: /projects/2026_oceanhub/
        secondary_label: Project record
        repository_href: https://github.com/liuh886/OceanHub
        repository_label: Repository
      - ref: P-03
        title: 4D Seismic Hub
        status: KNOWLEDGE PRODUCT
        kind: Time-lapse seismic / monitoring
        summary: A curated knowledge hub that organizes 4D seismic best practices and case studies for early-stage technical screening.
        href: https://liuh886.github.io/4d-seismic-hub/
        primary_label: Open app
        secondary_href: /projects/2025_4d_seismic/
        secondary_label: Project record
        repository_href: https://github.com/liuh886/4d-seismic-hub
        repository_label: Repository
      - ref: P-04
        title: Climate-to-energy downscaling
        status: RESEARCH PROJECT
        kind: Climate modeling / wind-energy planning
        summary: Quantile-based bias adjustment and downscaling of CMIP6 wind-speed projections against ERA5, testing when corrected climate data becomes useful for energy-system modeling.
        href: /projects/2023_downscaling/
        primary_label: View project
      - ref: P-05
        title: Quad 35 hybrid seismic acquisition
        status: FIELD PROJECT
        kind: Streamer + OBN / offshore Bergen
        summary: Technical review, onboard acquisition, data QC, reprocessing, and operational modeling for the first commercial hybrid streamer-and-node survey.
        href: /projects/2020_q35/
        primary_label: View project
      - ref: P-06
        title: OffshoreOrient Studio
        status: ARCHIVED SOFTWARE
        kind: Offshore seismic QC / navigation + source
        summary: An internal Python toolbox for shot-by-shot acquisition QC, RMS and noise analysis, trace editing, and real-time gun-source alarms, used by survey colleagues and registered as software copyright.
        href: /projects/2019_offshoreorient/
        primary_label: View project
  - id: "code"
    kicker: REPOSITORY ARCHIVE
    title: Open-source tools and methods
    summary: Smaller codebases, reusable artifacts, and upstream contributions that show the technical work behind the larger systems.
    deployments:
      - ref: C-01
        title: iCal Pro for Obsidian
        status: PLUGIN
        kind: Markdown tasks / iCalendar
        summary: An Obsidian plugin that converts Markdown tasks into standards-compliant feeds for Google, Apple, Outlook, and other calendar clients.
        href: https://community.obsidian.md/plugins/ical-plugin-pro
        primary_label: Open plugin
        secondary_href: https://github.com/liuh886/obsidian-ical-plugin-pro
        secondary_label: Repository
      - ref: C-02
        title: Ductor — AI Agentic Harness
        status: OPEN-SOURCE CONTRIBUTOR
        kind: Agent orchestration / multi-provider CLI
        summary: Upstream contributions covering Windows and Docker compatibility, Telegram streaming, provider and model discovery, and Antigravity runtime support for an AI agentic harness.
        href: https://github.com/PleasePrompto/ductor
        primary_label: Upstream project
        secondary_href: https://github.com/PleasePrompto/ductor/pull/153
        secondary_label: Merged contribution
      - ref: C-03
        title: HTTP to Obsidian CLI Gateway
        status: INFRASTRUCTURE
        kind: Agent-to-vault bridge
        summary: A small HTTP proxy that lets sandboxed AI agents reach a host-side Obsidian CLI without exposing the whole machine.
        href: https://github.com/liuh886/http-to-obsidian-cli-gateway
        primary_label: Repository
      - ref: C-04
        title: Open Phrasebank
        status: OPEN SOURCE
        kind: Academic writing / corpus analysis
        summary: A customizable phrasebank workflow built from scientific corpora, with examples comparing climate-change language across disciplines.
        href: /projects/2024_open_phrasebank/
        primary_label: View project
        secondary_href: https://github.com/liuh886/open-phrasebank
        secondary_label: Repository
