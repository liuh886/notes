phases:
  - id: "PHASE 01"
    title: "Foundations"
    status: "GEODESY / GEOMATICS"
    summary: "Technical formation in geodesy, geomatics, spatial data, and Earth observation. This is the base layer behind the later climate, offshore, and geospatial systems work."
  - id: "PHASE 02"
    title: "Field Work"
    status: "OFFSHORE / GEOPHYSICS"
    summary: "Offshore geophysical work and survey operations shaped a practical understanding of expensive, uncertain, high-stakes Earth-system data."
  - id: "PHASE 03"
    title: "Research"
    status: "UIO / CLIMATE DATA"
    summary: "Geosciences research connected remote sensing, snow-depth modeling, spatial validation, and climate-related data systems."
  - id: "PHASE 04"
    title: "Builder Phase"
    status: "AI-NATIVE SYSTEMS"
    summary: "Independent tools, public data systems, and personal operating surfaces now connect climate intelligence, geospatial systems, and AI productivity."
