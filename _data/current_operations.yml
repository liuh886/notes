  - id: OP-04
    title: Climate-to-energy downscaling
    status: RESEARCH MODEL
    summary: Quantile-based bias adjustment and downscaling of CMIP6 wind-speed projections against ERA5, testing when corrected climate data becomes useful for energy-system modeling.
    href: /projects/2023_downscaling/
    label: View project

