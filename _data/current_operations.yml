operations:
  - id: OP-01
    title: CCUS Policy Hub
    status: CLIMATE INTELLIGENCE
    summary: Open-source CCUS intelligence platform connecting policy, regulation, project deployment, capacity, and governance evidence across regions.
    href: https://liuh886.github.io/ccus-policy-hub/
    label: Open system
  - id: OP-02
    title: Ownly
    status: LOCAL-FIRST APP
    summary: A local-first ownership memory and decision ledger for tracking what you own, what it costs, how you use it, and what you learn.
    href: https://liuh886.github.io/ownly/
    label: Open app
  - id: OP-03
    title: AlphaEngine
    status: QUANT RESEARCH
    summary: A governed medium-frequency strategy research platform connecting market data, model research, backtests, signals, and auditable evidence.
    href: https://liuh886.github.io/alpha_engine/
    label: Open app
    secondary_href: https://github.com/liuh886/alpha_engine
    secondary_label: Repository
  - id: OP-04
    title: FlappyK
    status: MARKET GAME
    summary: A trading game that tests market intuition on hidden historical K-line windows—trade first, discover the asset and period afterward.
    href: https://liuh886.github.io/FlappyK/
    label: Play game
  - id: OP-05
    title: RhythmCoach
    status: SPEECH TRAINING
    summary: A rehearsal tool for speakers and podcasters, combining scripts, recording, timing, and interpretable rhythm feedback.
    href: https://liuh886.github.io/RhythmCoach/
    label: Open app
  - id: OP-06
    title: NewsFlow
    status: EDITORIAL SYSTEM
    summary: An editor-led publication system that turns automated discovery into curated recurring issues through a governed review workflow.
    href: https://liuh886.github.io/NewsFlow/
    label: Open app
    secondary_href: https://github.com/liuh886/NewsFlow
    secondary_label: Repository

dispatches:
  - date: 2026-08-02
